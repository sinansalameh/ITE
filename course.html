<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المقرر — ITE Masar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toolbar" style="position:static">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" class="btn btn-outline-blueprint btn-sm">
      <i class="bi bi-arrow-right me-1"></i> رجوع إلى المخطط الكامل
    </a>
    <a href="notes.html" class="pill text-decoration-none" style="color:inherit">
      <i class="bi bi-journal-text me-1"></i> ملاحظات ومعلومات البرنامج
    </a>
    <a href="planner.html" class="pill text-decoration-none" style="color:inherit">
      <i class="bi bi-clipboard-check me-1"></i> المخطط الشخصي
    </a>
    <a href="feedback.html" class="pill text-decoration-none" style="color:inherit">
      <i class="bi bi-chat-square-text me-1"></i> شاركنا ملاحظاتك
    </a>
  </div>
</div>

<main class="container py-4" id="app"></main>

<footer class="site-footer">
  <div class="container">
    <span>مُعدّة اعتمادًا على قائمة المقررات الرسمية للبرنامج والنماذج الاسترشادية لكل مسار (svuonline.org).</span>
  </div>
</footer>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const code = params.get('code');
const app = document.getElementById('app');
const course = COURSE_MAP[code];

function trackBadge(id){
  const t = TRACKS.find(x => x.id === id);
  if (!t) return '';
  return `<span class="pill" style="border-inline-start:3px solid ${t.color}">${t.label}</span>`;
}

function relList(codes, emptyText){
  if (!codes.length) return `<div class="rel-empty">${emptyText}</div>`;
  return `<ul class="rel-list">${codes.map(cd => {
    const cc = COURSE_MAP[cd];
    if (!cc) return '';
    const cat = CATEGORIES[cc.category];
    return `<a href="course.html?code=${encodeURIComponent(cd)}" style="--accent:${cat.color}">
        <span>
          <span class="d-block">${cc.name}</span>
          <span class="d-block" style="font-size:.75rem;color:var(--text-2)">${cc.nameEn}</span>
        </span>
        <span class="rel-code mono">${cd} · ${cc.credits} نقطة</span>
      </a>`;
  }).join('')}</ul>`;
}

function termsLabel(c){
  const list = allPossibleTerms(c);
  if (list.length === 1) return `الفصل ${TERM_LABELS[list[0]]}`;
  return 'الفصلان ' + list.sort((a,b)=>a-b).map(t => TERM_LABELS[t]).join(' و');
}

if (!course){
  app.innerHTML = `
    <div class="empty-state">
      <i class="bi bi-exclamation-triangle fs-3 d-block mb-2"></i>
      لم يتم العثور على مقرر بهذا الرمز.
      <div class="mt-3"><a href="index.html" class="btn btn-blueprint btn-sm">العودة إلى المخطط</a></div>
    </div>`;
} else {
  const cat = CATEGORIES[course.category];
  document.title = `${course.name} (${course.code}) — تفاصيل المقرر`;

  const extraReq = [];
  if (course.creditGate) extraReq.push(`يشترط الحصول على ${course.creditGate} وحدة معتمدة على الأقل قبل التسجيل بهذا المقرر.`);
  if (course.concurrent && course.concurrent.length){
    const names = course.concurrent.map(cd => (COURSE_MAP[cd]||{}).name || cd).join('، ');
    extraReq.push(`يشترط تسجيل المقرر النظري بالتوازي معه (وليس بالضرورة النجاح فيه): ${names}. كما يخضع لنفس المتطلبات السابقة الخاصة بذلك المقرر.`);
  }

  app.innerHTML = `
    <div class="detail-hero" style="--cat:${cat.color}">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
        <div>
          <div class="code-badge mono mb-1">${course.code}</div>
          <h1 class="h3 fw-bold mb-1">${course.name}</h1>
          <div class="mb-2" style="color:var(--text-1);font-size:1.05rem">${course.nameEn}</div>
          <div class="d-flex flex-wrap gap-2">
            <span class="pill"><i class="bi bi-award me-1"></i> ${course.credits} نقطة اعتماد</span>
            <span class="pill"><i class="bi bi-calendar3 me-1"></i> ${termsLabel(course)}</span>
            <span class="pill" style="border-inline-start:3px solid ${cat.color}">${cat.label}</span>
            ${course.tracks.map(trackBadge).join('')}
          </div>
        </div>
      </div>
      <p class="mt-3 mb-0" style="color:var(--text-1)">${DESC_TEMPLATES[course.category] || ''}</p>
      ${extraReq.length ? `
        <div class="mt-3 pt-3" style="border-top:1px dashed var(--line)">
          ${extraReq.map(t => `<div style="color:var(--text-1);font-size:.9rem"><i class="bi bi-info-circle me-1" style="color:var(--accent)"></i>${t}</div>`).join('')}
        </div>` : ''}
    </div>

    <div class="row g-4 mt-1">
      <div class="col-md-6">
        <div class="section-title mt-0">
          <span class="bar" style="background:#F4B740"></span>
          <h2>المتطلبات السابقة المباشرة</h2>
        </div>
        ${relList(course.prereq, 'لا يوجد متطلب سابق — يمكن تنزيل هذا المقرر مباشرة.')}
      </div>
      <div class="col-md-6">
        <div class="section-title mt-0">
          <span class="bar" style="background:#4CAF7D"></span>
          <h2>مقررات تعتمد على هذا المقرر</h2>
        </div>
        ${relList(course.dependents, 'لا توجد مقررات تشترط هذا المقرر كمتطلب سابق حتى الآن.')}
      </div>
    </div>

    <div class="mt-4">
      <div class="section-title mt-0">
        <span class="bar" style="background:var(--accent)"></span>
        <h2>كامل سلسلة المتطلبات السابقة</h2>
      </div>
      <div id="chainWrap"></div>
    </div>

    <div class="mt-4">
      <div class="section-title mt-0">
        <span class="bar" style="background:var(--accent)"></span>
        <h2>توصيف المقرر</h2>
      </div>
      <div class="detail-hero" style="--cat:${cat.color}">
        <h3 class="h6 fw-bold mb-2"><i class="bi bi-bullseye me-1"></i> أهداف المقرر</h3>
        ${course.courseInfo && course.courseInfo.goals ? `
          <p class="mb-3" style="color:var(--text-1)">${course.courseInfo.goals}</p>
        ` : `
          <div class="placeholder-box mb-3">
            لم يُعثر بعد على «أهداف المقرر» الرسمية لهذا المقرر من وثيقة توصيف SVUPedia.
            <span class="fill-hint">يمكن لصقها هنا لاحقًا.</span>
          </div>
        `}

        <h3 class="h6 fw-bold mb-2"><i class="bi bi-check2-circle me-1"></i> النتائج التعليمية المرجوة</h3>
        ${course.courseInfo && course.courseInfo.outcomes && course.courseInfo.outcomes.length ? `
          <ul class="mb-3" style="color:var(--text-1)">
            ${course.courseInfo.outcomes.map(o => `<li>${o}</li>`).join('')}
          </ul>
        ` : `
          <div class="placeholder-box mb-3">
            لم يُعثر بعد على «النتائج التعليمية المرجوة» الرسمية لهذا المقرر.
            <span class="fill-hint">يمكن لصقها هنا لاحقًا.</span>
          </div>
        `}

        <h3 class="h6 fw-bold mb-2"><i class="bi bi-list-check me-1"></i> مفردات المقرر (الفصول)</h3>
        ${course.courseInfo && course.courseInfo.syllabus && course.courseInfo.syllabus.length ? `
          <div class="table-responsive mb-1">
            <table class="table table-sm" style="color:var(--text-1);border-color:var(--line)">
              <thead>
                <tr style="color:var(--text-2)">
                  <th style="width:4rem">#</th>
                  <th style="width:14rem">عنوان الفصل</th>
                  <th>محتوى الفصل</th>
                </tr>
              </thead>
              <tbody>
                ${course.courseInfo.syllabus.map(s => `
                  <tr style="border-color:var(--line)">
                    <td class="mono" style="color:var(--accent)">${s.num}</td>
                    <td class="fw-bold">${s.title}</td>
                    <td>${s.topics.map((t,i) => `${i+1}. ${t}`).join('&nbsp;&nbsp;')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="placeholder-box mb-3">
            لم يُعثر بعد على «مفردات المقرر» الرسمية لهذا المقرر.
            <span class="fill-hint">يمكن لصقها هنا لاحقًا.</span>
          </div>
        `}
      </div>
    </div>

    <div class="mt-4">
      <div class="section-title mt-0">
        <span class="bar" style="background:var(--accent)"></span>
        <h2>ملاحظات عامة عن المقرر والامتحان</h2>
      </div>
      <div class="placeholder-box">
        — لم تتم تعبئة هذا القسم بعد —
      </div>
    </div>
  `;

  const ancestors = Array.from(getAncestors(course.code));
  const chainWrap = document.getElementById('chainWrap');
  if (!ancestors.length){
    chainWrap.innerHTML = `<div class="rel-empty">هذا المقرر لا يعتمد على أي سلسلة متطلبات سابقة.</div>`;
  } else {
    chainWrap.innerHTML = relList(ancestors, '');
  }
}
</script>
</body>
</html>
